appId: com.bloumechat.app
productName: BloumeChat
copyright: Copyright © 2026 Bloume SAS
directories:
  output: dist
  buildResources: resources
protocols:
  name: BloumeChat
  schemes:
    - bloumechat
files:
  - from: .
    filter:
      - package.json
      - app
      - config.json
extraResources:
  - from: resources/LICENSE.txt
    to: LICENSE.txt
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  - from: resources/voice
    to: voice
    filter:
      - "**/*.png"
publish:
  provider: github
  owner: BloumeSAS
  repo: bloumechat-app
  releaseType: release
win:
  # Exact Distinguished Name of the OV code-signing certificate (SSL.com, on the YubiKey).
  # electron-updater compares this CASE-SENSITIVELY with the signer of every downloaded
  # update ("BLOUME SAS", all caps, not "Bloume SAS") — a mismatch rejects every update.
  # It is also what makes electron-updater verify signatures at all (no publisherName = no check).
  publisherName:
    - "CN=BLOUME SAS, O=BLOUME SAS, L=Paris, C=FR"
  # SHA-1 thumbprint of that certificate — never `certificateSubjectName`: the Personal store
  # also holds old self-signed "Bloume SAS" certificates that a name match could pick instead.
  # The certificate must be visible in the user store (YubiKey inserted + minidriver +
  # Certificate Propagation service); signtool then asks for the PIN in a Windows prompt.
  certificateSha1: 88FF0E7BE94A7BEBDA3F73A93A7B5767ECB202C9
  signingHashAlgorithms:
    - sha256
  # RFC 3161 timestamp: keeps the signature valid after the certificate expires (Nov 2027).
  rfc3161TimeStampServer: http://ts.ssl.com
  target:
    - nsis
  artifactName: "${productName}-Setup-${version}.${ext}"
appx:
  artifactName: "${productName}-Setup-${version}.${ext}"
  identityName: com.bloumechat.app
  publisher: "CN=Bloume SAS, O=Bloume SAS, L=Paris, C=FR"
  languages:
    - fr-FR
    - en-US
nsis:
  artifactName: "${productName}-Setup-${version}.${ext}"
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BloumeChat
  license: resources/LICENSE.txt
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # appId stays constant across releases, so re-running the Setup.exe is already
  # detected as an upgrade (same registry uninstall key + install dir), not a fresh
  # install. Explicit here so it can never be flipped accidentally — user settings/
  # store data live in %APPDATA%\BloumeChat, outside the install dir either way.
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
    - zip
  category: public.app-category.social-networking
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Network
